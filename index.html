const home=()=>`<section class="hero"><div class="hero-copy"><span class="small"><span class="dot"></span>${t("قهوة مختصة / الرياض","SPECIALTY COFFEE / RIYADH")}</span><div><h1>${t("مساحةٌ لك.","A space.")}<em>${t("وللحظة.","For you.")}</em></h1><p class="muted">${t("قهوة، حلوى، ووقت تستمتع فيه بما تحب. خذ لحظتك بعيدًا عن صخب اليوم.","Coffee, something sweet, and a moment to call your own. Make room for the good things.")}</p></div><div class="hero-actions">${button("menu","اكتشف المنيو","Explore the menu")}${link("location",t("كيف تصل إلينا","Find us")+" "+arrow,"text-link")}</div></div><div class="hero-media">${photo("iced",t("قهوة باردة وحليب في كوب زجاجي","Iced coffee and milk in a glass"),"eager")}<span class="hero-stamp">MAKE ROOM<strong>JAS.</strong>FOR YOU</span><span class="photo-label">${credit()}</span></div></section><div class="strip"><b><span class="dot"></span>${t("لحظة قهوة تستحقها","A moment worth making room for")}</b><span class="small" dir="ltr">COFFEE / MATCHA / DESSERTS</span><span class="small">RIYADH, SA</span></div><section class="section shell"><div class="section-top"><div><div class="small muted">01 / ${t("مختارات من المنيو","MENU EDIT")}</div><h2>${t("على ذوقك.","Find your moment.")}</h2></div>${link("menu",t("عرض القائمة","View the menu")+" "+arrow,"text-link")}</div><div class="feature-grid">${feature("salted-vanilla","آيس سولتد فانيلا","Iced salted vanilla","cold")}${feature("matcha","ماتشا","Matcha","cold")}${feature("tiramisu","تيراميسو","Tiramisu","sweet")}</div><p class="menu-note">${t("مختارات مستندة إلى مصادر عامة؛ الصور والأسعار والتوفر بحاجة لاعتماد الكافيه.","Selections from public references; images, pricing and availability require owner approval.")}</p></section>${story()}<section class="section shell">${location()}</section>`;
function filterItems(items,cat,q){let normalize=s=>s.toLowerCase().replace(/[\u064b-\u065f]/g,"").replace(/[أإآ]/g,"ا").trim();q=normalize(q);return items.filter(i=>(cat==="all"||cat===i[3])&&(!q||normalize(i[1]+" "+i[2]).includes(q)))}
const renderMenu=()=>{const found=filterItems(D.items,category,query);let out=document.getElementById("menu-list");if(!out)return;out.innerHTML=found.length?found.map((i,n)=>`<div class="menu-row"><span class="num" dir="ltr">${String(n+1).padStart(2,"0")}</span><button data-item="${i[0]}"><h3>${esc(name(i))}</h3><small>${esc(i[lang==="ar"?2:1])}</small></button><span class="price">${t("السعر غير مؤكد","Price pending")}</span></div>`).join(""):`<p class="empty">${t("لا توجد نتائج مطابقة. جرب كلمة أخرى.","No matching items. Try another search.")}</p>`;document.querySelectorAll("[data-cat]").forEach(b=>{b.classList.toggle("active",b.dataset.cat===category);b.setAttribute("aria-pressed",String(b.dataset.cat===category))});document.getElementById("count").textContent=t("عدد النتائج: ","Results: ")+found.length};
const menu=()=>`${pagehero("01 / MENU","المنيو.","The menu.","من القهوة إلى الحلوى. استكشف الأصناف المرصودة في المصادر العامة؛ القائمة بانتظار التحقق الرسمي.","From coffee to dessert. Browse publicly reported items; the official menu is awaiting verification.")}<section class="section shell menu-layout"><aside class="menu-side"><label for="search" class="small">${t("ابحث في المنيو","SEARCH MENU")}</label><input id="search" type="search" value="${esc(query)}" placeholder="${t("مثال: ماتشا","e.g. Matcha")}"><div class="cats">${Object.keys(catNames).map(k=>`<button data-cat="${k}" aria-pressed="false">${cname(k)} <span>${k==="all"?D.items.length:D.items.filter(i=>i[3]===k).length}</span></button>`).join("")}</div><button class="pill outline" id="print">${t("طباعة القائمة","Print menu")}</button></aside><div><p id="count" class="small muted" aria-live="polite"></p><div id="menu-list" class="menu-list"></div><p class="menu-note">${t("لا توجد أسعار رسمية مؤكدة. هذه القائمة استرشادية وليست عرضًا للبيع.","No official prices are verified. This is a reference list, not an offer for sale.")}</p></div></section>`;
const gallery=()=>`${pagehero("04 / GALLERY","لغة التفاصيل.","The details.","مجموعة مراجع فوتوغرافية للاتجاه الفني المقترح، لا صورًا للمكان الحقيقي.","A photographic moodboard for the proposed art direction, not images of the actual café.")}<section class="section shell"><div class="gallery">${["space","iced","matcha","dessert"].map(k=>`<button data-photo="${k}" aria-label="${t("تكبير الصورة","Enlarge photograph")}">${photo(k,t("صورة توضيحية","Illustrative photograph"))}<span class="tag">${t("مرجع بصري","Visual reference")}</span></button>`).join("")}</div></section>`;
const about=()=>`${pagehero("02 / ABOUT","عن المساحة.","About the space.","جست أ سبيس، كافيه في حي النخيل بمدينة الرياض.","Just A Space, a café in Al Nakheel, Riyadh.")}${story()}<section class="section shell prose"><h2>${t("فكرة التصميم.","The design idea.")}</h2><p>${t("البساطة والخطوط المعمارية وتفاصيل القهوة هي الإلهام وراء هذه التجربة الرقمية المقترحة. القصة الرسمية للعلامة بانتظار اعتماد المالك.","Simplicity, architectural lines and the details of coffee inspire this proposed digital experience. The official brand story is awaiting owner approval.")}</p>${button("gallery","استكشف المعرض","Explore gallery")}</section>`;
const experience=()=>`${pagehero("03 / EXPERIENCE","لحظات تُعاش.","Moments to savour.","من القهوة المختصة إلى الحلوى، اختر ما يناسب لحظتك.","From specialty coffee to something sweet, find what suits your moment.")}<section class="section shell"><div class="feature-grid">${feature("salted-vanilla","قهوة باردة","Iced coffee","cold")}${feature("matcha","ماتشا","Matcha","cold")}${feature("tiramisu","حلويات","Desserts","sweet")}</div><p class="menu-note">${credit()}</p><div style="margin-top:28px">${button("menu","عرض المنيو","Explore menu")}</div></section>${story()}`;
const contact=()=>`${pagehero("06 / CONTACT","خلّنا على تواصل.","Stay connected.","للموقع والتفاصيل، يمكنك الرجوع إلى القنوات المدرجة أدناه.","For location and details, refer to the channels listed below.")}<section class="section shell"><div class="contact-grid">${external(D.maps,"<b>Google Maps</b>")}${external(D.instagram,"<b>Instagram</b>")}</div><p class="menu-note">${t("رقم الهاتف والبريد الإلكتروني غير مؤكدين. حساب إنستغرام وارد في الأدلة العامة وبانتظار اعتماد المالك.","Phone and email are not verified. The Instagram account appears in public directories and awaits owner approval.")}</p></section>`;
const legal=()=>`${pagehero(page.toUpperCase(),title(page),title(page),t("إشعار خاص بالنسخة الاستعراضية.","Preview notice."), "Preview notice.")}<section class="section shell prose"><p>${page==="privacy"?t("لا تتضمن هذه المعاينة حسابات مستخدمين أو مدفوعات أو نماذج تجمع بيانات شخصية. تستضيف GitHub الموقع وتُحمّل الخطوط والصور من خدمات خارجية قد تتلقى بيانات اتصال تقنية. تخضع الروابط الخارجية لسياسات خدماتها.","This preview has no user accounts, payments or personal-data forms. GitHub hosts the website; external font and image services may receive technical connection data. External links have their own policies."):t("هذه تجربة تصميم مستقلة غير رسمية وليست قناة بيع أو طلب معتمدة. الأصناف والصور والتوفر والأسعار تتطلب اعتماد المالك قبل إطلاق الموقع الرسمي.","This is an independent, unofficial design concept, not an authorized ordering channel. Products, photos, availability and prices require owner approval before official launch.")}</p>${link("home",t("العودة للرئيسية","Back to home")+" "+arrow,"text-link")}</section>`;
function openItem(id){const i=D.items.find(x=>x[0]===id);if(!i)return;dialog.innerHTML=`<div class="dialog-content"><button class="close" data-close aria-label="${t("إغلاق","Close")}">×</button>${i[4]?photo(i[4],t("صورة توضيحية","Illustrative photograph")):""}<span class="small muted">${cname(i[3])}</span><h2 style="font-size:clamp(2rem,6vw,3.4rem)">${esc(name(i))}</h2><p>${t("صنف مرصود في المصادر العامة. السعر والتوفر والمكونات بانتظار التحقق من المالك.","Publicly reported item. Pricing, availability and ingredients await owner verification.")}</p>${i[4]?`<p class="menu-note">${credit()}</p>`:""}${external(D.maps,t("موقع الكافيه","Café location"),"pill")}</div>`;dialog.showModal()}
function parse(h){const m=h.match(/^#\/(ar|en)(?:\/([a-z-]+))?$/);return m?[m[1],D.routes.includes(m[2])?m[2]:"home"]:["ar","home"]}
function render(){if(dialog.open)dialog.close();const next=parse(location.hash);if(next[1]!==page){category="all";query=""} [lang,page]=next;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title="JUST A SPACE | "+title(page);const body={home,menu,about,experience,gallery,location:()=>`${pagehero("05 / VISIT","زورونا.","Visit us.","حي النخيل، الرياض، المملكة العربية السعودية.","Al Nakheel, Riyadh, Saudi Arabia.")}<section class="section shell">${location()}<p class="menu-note">${t("ساعات العمل الحالية بانتظار التأكيد. راجع قوقل ماب قبل الزيارة.","Current opening hours await confirmation. Check Google Maps before visiting.")}</p></section>`,contact,privacy:legal,terms:legal}[page]();root.innerHTML=header()+`<main id="main" tabindex="-1">${body}</main>`+footer();if(page==="menu"){renderMenu();document.getElementById("search").addEventListener("input",e=>{query=e.target.value;renderMenu()})}window.scrollTo({top:0,behavior:"instant"})}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(e.target.closest(".skip")){e.preventDefault();document.getElementById("main").focus();return}if(!b)return;if(b.id==="burger"){let n=document.getElementById("nav");b.setAttribute("aria-expanded",String(n.classList.toggle("open")));return}if(b.dataset.cat){category=b.dataset.cat;renderMenu();return}if(b.dataset.item){openItem(b.dataset.item);return}if(b.dataset.photo){dialog.innerHTML=`<div class="dialog-content gallery-full"><button class="close" data-close aria-label="${t("إغلاق","Close")}">×</button>${photo(b.dataset.photo,t("صورة توضيحية","Illustrative photograph"))}<p>${credit()}</p></div>`;dialog.showModal();return}if(b.hasAttribute("data-close")){dialog.close();return}if(b.id==="print"){window.print();return}if(b.id==="copy"){const s=document.getElementById("status");try{await navigator.clipboard.writeText(document.getElementById("address").textContent);s.textContent=t("تم نسخ العنوان","Address copied")}catch{ s.textContent=t("تعذر النسخ؛ حدد العنوان وانسخه يدويًا.","Could not copy; select and copy the address manually.")}}});
dialog.addEventListener("click",e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
window.addEventListener("hashchange",render);document.addEventListener("error",e=>{if(e.target.tagName==="IMG"){e.target.style.visibility="hidden";e.target.parentElement.style.background="#b8b8a7"}},true);
render();
})();</script></body></html>
